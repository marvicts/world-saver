<html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#14110f">
<title>Alvorada · mobile</title>
<style>
:root{--bg:#f3ece0;--fg:#2a1d14;--ui:#e8a530;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14110f;--fg:#f0e6d2}}
:root[data-theme="dark"]{--bg:#14110f;--fg:#f0e6d2}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif;display:flex;flex-direction:column;align-items:center;justify-content:center}
canvas{max-width:100%;max-height:78vh;background:#14110f;border:2px solid #3a2418;image-rendering:pixelated}
p{margin:8px 12px;font-size:14px;text-align:center}
#nk{display:none;position:fixed;z-index:50;box-sizing:border-box;padding:6px 10px;text-align:center;background:#14110f;color:#ffd36b;border:3px solid #e8a530;font-family:Georgia,serif;outline:none;border-radius:6px}
#t{display:none}
#rot{display:none;position:fixed;inset:0;z-index:99;background:#14110f;color:#e8a530;align-items:center;justify-content:center;text-align:center;font-size:22px;padding:24px}
@media (pointer:coarse){#t{display:block}html,body{overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}canvas{max-height:100vh;border:0}body>p{display:none}}
@media (pointer:coarse) and (orientation:portrait){#rot{display:flex}}
#t button{position:fixed;width:58px;height:58px;border-radius:50%;border:2px solid var(--ui);background:rgba(20,17,15,.75);color:#f0e6d2;font-size:22px;touch-action:none}
#tu button{display:none;position:fixed;z-index:40;align-items:center;justify-content:center;box-sizing:border-box;border-radius:50%;border:2px solid rgba(232,165,48,.8);background:rgba(20,17,15,.45);color:#f0e6d2;font-size:5vh;padding:0;touch-action:none;-webkit-tap-highlight-color:transparent;font-family:Georgia,serif}
#tu button.sel{outline:3px solid #ffd36b}
body.ed #tu .bw,body.ed #tu .ab,body.ed #tu .ab2{display:flex!important}
#ed{display:none;position:fixed;z-index:60;top:1.5vh;left:50%;transform:translateX(-50%);background:rgba(10,8,6,.93);border:2px solid #e8a530;border-radius:10px;padding:1vh 1.5vw;gap:1.2vw;align-items:center;color:#f0e6d2;font-family:Georgia,serif;font-size:3.2vh;white-space:nowrap}
#ed button{background:#3a2a1a;color:#ffd36b;border:2px solid #e8a530;border-radius:8px;font-size:3.6vh;padding:.5vh 1.3vw;font-family:Georgia,serif;touch-action:manipulation}
body.ed #ed{display:flex}
#tu button.on{background:rgba(232,165,48,.6)}
body.m-g #tu .g,body.m-l #tu .l,body.m-mn #tu .mn,body.m-ok #tu .ok,body.m-fj #tu .mn,body.m-fj #tu .fj,body.m-nk #tu .nk{display:flex}
#tu .ab2{display:none!important}body.abil2.m-g #tu .ab2{display:flex!important}
#tu .ab{display:none!important}body.abil.m-g #tu .ab{display:flex!important}
#tu .bw{display:none!important}body.bow.m-g #tu .bw{display:flex!important}
body.mob{margin:0;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.mob canvas{border:0;max-width:none;max-height:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%)}
body.mob>p{display:none}
@media (orientation:portrait){body.mob #rot{display:flex}}
</style></head><body>
